# filepath: d:\work\Projects\discord-poll-bot\docker-compose.yml
version: '3.7' # Use an appropriate version

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.2 # Use a specific version matching your needs
    container_name: elasticsearch
    environment:
      - discovery.type=single-node # For single-node cluster
      - xpack.security.enabled=false # Disable security for local dev (NOT recommended for production)
      # - ELASTIC_PASSWORD=yoursecurepassword # Use this if security is enabled
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Adjust memory limits as needed
    ports:
      - "9200:9200" # Map host port 9200 to container port 9200
      - "9300:9300" # For internal cluster communication (optional for single-node)
    volumes:
      - esdata:/usr/share/elasticsearch/data # Persist Elasticsearch data
    networks:
      - elastic

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.2 # Match Elasticsearch version
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200 # Point Kibana to the Elasticsearch container
    ports:
      - "5601:5601" # Map host port 5601 to container port 5601
    depends_on:
      - elasticsearch # Wait for Elasticsearch to be available
    networks:
      - elastic

volumes:
  esdata: # Define the named volume for data persistence
    driver: local

networks:
  elastic: # Define the network for containers to communicate
    driver: bridge